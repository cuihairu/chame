name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      - name: Test
        run: make test-race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Lint
        # built from source so the linter toolchain matches the job's Go
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Dependency vulnerability check
        # latest: the scanner itself should track new advisories
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
