<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Chame · Go 游戏后端框架架构</title>
<desc id="desc">Chame 把区块链抽象在统一运行时之后：游戏侧只面对一套 API，EVM 与 Solana 都是其后的适配器。自上而下分层：开发者游戏业务（玩家/角色/道具/战斗/房间/匹配/排行榜/游戏经济，不被框架默认业务模型限制）；application/ 应用服务（transaction/eventing/gameledger/idempotency/projection）；capability/ 链无关契约（account/asset/event/finality/network/nft/signer/transaction）；core/ 框架基础设施（runtime/module/lifecycle/clock/config/errors/health/identifiers/logging/metrics）；adapters/ 具体链（EVM 经 go-ethereum、Solana 经 solana-go）与 infrastructure/（persistence 经 pgx/signer/observability）。核心原则：A core 不导入任何链 SDK，链 SDK 只存在于适配器实现层；B 公共抽象不抹平链特有语义（EVM 高度/哈希/回执 vs Solana slot/签名/confirmation status）；C 模块可选而非强制完整套装。虚线为可选接入关系，实线为调用关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:17px;fill:#435570}.small{font-size:15px;fill:#52647b}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1200" height="1120" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Chame · Go 游戏后端框架</text>
<text x="40" y="80" class="body" text-anchor="start">区块链抽象在统一运行时之后 · 游戏侧一套 API · EVM / Solana 为适配器 · 骨架阶段</text>

<path d="M600 200 V240" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="game-app" data-from="game" data-to="application" d="M600 200 V240" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 340 V380" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="app-cap" data-from="application" data-to="capability" d="M600 340 V380" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 480 V520" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="cap-core" data-from="capability" data-to="core" d="M600 480 V520" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M600 680 V720" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="core-adapter" data-from="core" data-to="adapters" d="M600 680 V720" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M320 640 V720" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="infra-adapter" data-from="infrastructure" data-to="adapters" d="M320 640 V720" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<g id="game" data-node="game"><rect x="60" y="110" width="1080" height="90" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="80" y="144" class="name" text-anchor="start">游戏业务（开发者自有，框架之外）</text>
<text x="80" y="175" class="body" text-anchor="start">玩家 · 角色 · 道具 · 战斗 · 房间 · 匹配 · 排行榜 · 游戏经济（由项目决定，不被框架默认业务模型限制）</text>
</g>
<g id="application" data-node="application"><rect x="60" y="240" width="1080" height="100" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="80" y="274" class="name" text-anchor="start">application/（应用服务）</text>
<text x="80" y="305" class="body" text-anchor="start">transaction · eventing · gameledger · idempotency · projection</text>
<text x="80" y="329" class="body" text-anchor="start">明确的异步交易状态 · 幂等语义 · 故障恢复</text>
</g>
<g id="capability" data-node="capability"><rect x="60" y="380" width="1080" height="100" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="414" class="name" text-anchor="start">capability/（链无关契约）</text>
<text x="80" y="445" class="body" text-anchor="start">account · asset · event · finality · network · nft · signer · transaction</text>
<text x="80" y="469" class="body" text-anchor="start">保留链特有数据/错误/确认状态/交易语义（原则 B）</text>
</g>
<g id="core" data-node="core"><rect x="60" y="520" width="1080" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="554" class="name" text-anchor="start">core/（框架基础设施，不导入链 SDK — 原则 A）</text>
<text x="80" y="585" class="body" text-anchor="start">runtime · module · lifecycle · clock · config · errors · health · identifiers · logging · metrics</text>
<text x="80" y="612" class="body" text-anchor="start">应用启动 · 依赖装配 · 模块管理（模块可选，非强制完整套装 — 原则 C）</text>
<text x="80" y="639" class="body" text-anchor="start">数据库 / 消息组件 / 签名服务 / RPC 提供方可替换</text>
</g>
<g id="infrastructure" data-node="infrastructure"><rect x="60" y="700" width="520" height="120" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="80" y="734" class="name" text-anchor="start">infrastructure/（基础设施实现）</text>
<text x="80" y="765" class="body" text-anchor="start">persistence（pgx / PostgreSQL）</text>
<text x="80" y="792" class="body" text-anchor="start">signer · observability</text>
</g>
<g id="adapters" data-node="adapters">
<rect x="620" y="700" width="520" height="120" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="640" y="734" class="name" text-anchor="start">adapters/（具体链 — 链 SDK 只在此层）</text>
<text x="640" y="765" class="body" text-anchor="start">EVM（go-ethereum）· Solana（solana-go）</text>
<text x="640" y="792" class="body" text-anchor="start">同一 EVM 适配器可接多个 EVM 网络实例 · Solana 不伪装成 EVM</text>
</g>

<g id="entry" data-node="entry"><rect x="400" y="860" width="400" height="70" rx="14" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
<text x="420" y="894" class="name" text-anchor="start">cmd/chame/main.go</text>
<text x="420" y="916" class="body" text-anchor="start">进程入口 · 装配运行时</text>
</g>
<path d="M600 820 V860" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="adapter-entry" data-from="adapters" data-to="entry" d="M600 820 V860" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>

<text x="620" y="228" class="label" text-anchor="middle">调用链能力</text>
<text x="620" y="368" class="label" text-anchor="middle">契约</text>
<text x="620" y="508" class="label" text-anchor="middle">基础设施</text>
<text x="620" y="700" class="label" text-anchor="middle">适配 / 落地</text>
<text x="620" y="848" class="label" text-anchor="middle">入口</text>
<text x="40" y="965" class="small" text-anchor="start">虚线：可选接入关系（core/adapters 边界、infrastructure 落地）· 实线：调用关系 · 状态：骨架，接口随 todo.md 分阶段落地</text>
<text x="40" y="990" class="small" text-anchor="start">原则 A：core 不导入 EVM/Solana SDK，链 SDK 只在适配器实现层 · 原则 B：公共抽象不抹平关键差异（EVM 高度/哈希/回执 vs Solana slot/签名/confirmation status）</text>
<text x="40" y="1015" class="small" text-anchor="start">原则 C：模块可选而非强制完整套装 · 可替换数据库 / 消息组件 / 签名服务 / RPC 提供方 · 脚手架可选，不依赖代码生成器运行</text>
<text x="40" y="1040" class="small" text-anchor="start">非目标：固定 MMO/房间制/棋牌等业务模型、统一资产结构、强制同库、自研节点/共识、内置托管私钥中心化钱包</text>
<text x="40" y="1065" class="small" text-anchor="start">布局与规则：docs/design/chame-spec.md（外部设计稿，非本仓事实，实施前须对代码核验）· 图示以本仓包结构为准</text>
</svg>
